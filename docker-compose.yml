services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # allow browser origin when frontend is served from docker
      - CLIENT_URL=http://localhost:8080,http://localhost:5173,http://localhost:3000
      - NODE_ENV=development
      - PORT=5000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # browser will call backend on your host machine
        VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

